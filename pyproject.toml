[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career"
version = "0.1.0"
description = "Tennis player career data and plots"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "matplotlib",
    "requests"
]

[tool.setuptools.packages.find]
where = ["src"]